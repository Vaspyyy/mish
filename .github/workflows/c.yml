name: C shell

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: make check CC=${{ matrix.compiler }}
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make sanitize CC=clang
